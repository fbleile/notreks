[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notreks"
version = "0.1.0"
description = "Reproducible causal discovery experiments with NOTREKS information"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
notreks = "notreks.cli:main"
notreks-aggregate = "notreks.aggregate:main"

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["numpy", "pandas", "scipy", "matplotlib"]
solvers = ["flopsearch>=0.3", "dagma>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

