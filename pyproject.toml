[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notreks"
version = "0.1.0"
description = "Reproducible causal discovery experiments with NOTREKS information"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
notreks = "notreks.cli:main"
notreks-aggregate = "notreks.aggregate:main"
notreks-external-check = "notreks.external:main"
notreks-external-import = "notreks.external_sources:main"
notreks-external-plan = "notreks.external_plan:main"
notreks-external-pack = "notreks.external_pack:main"
notreks-external-bundle = "notreks.external_bundle:main"
notreks-trend = "notreks.analysis:main"
notreks-exact = "notreks.exact:main"
notreks-exact-bic = "notreks.exact_bic:main"
notreks-exact-bic-dp = "notreks.exact_bic_dp:main"
notreks-inspect = "notreks.inspect:main"
notreks-preflight = "notreks.preflight:main"
notreks-catalog-plan = "notreks.catalog_planning:main"
notreks-jobfarm = "notreks.jobfarm:main"
notreks-jobfarm-retry = "notreks.jobfarm:retry_main"
notreks-figure = "notreks.figures:main"
notreks-manifest = "notreks.manifest:main"
notreks-solver-audit = "notreks.solver_audit:main"
notreks-release-audit = "notreks.release:main"
notreks-constraint-check = "notreks.constraint_diagnostics:main"
notreks-paper-outputs = "notreks.paper_outputs:main"
notreks-parity = "notreks.parity:main"

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["numpy", "pandas", "scipy", "matplotlib"]
solvers = ["flopsearch>=0.3", "dagma>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

